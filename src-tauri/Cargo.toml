[package]
name = "stickerforge"
version = "0.4.0"
description = "Local sticker and audio editor"
authors = ["emmanuelquintana"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }
rusqlite = { version = "0.43", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
getrandom = "0.4"
base64 = "0.22"
dunce = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
