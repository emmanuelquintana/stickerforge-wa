name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: choco install ffmpeg -y --no-progress
      - run: npm install --no-fund
      - run: npm test
      - run: node --check src/bot.mjs
      - run: python scripts/build.py
      - run: .\dist\StickerForge-WA-Setup-x64.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: StickerForge-WA-Windows-x64
          path: dist/*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StickerForge-WA-Windows-x64
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "StickerForge WA $GITHUB_REF_NAME" --generate-notes --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
